<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'"><title>Tangled Mess</title><link rel="stylesheet" href="style.css"></head>
<body><header><strong>◎ tangled mess</strong><span class="workspace">PERSONAL WORKSPACE</span><nav aria-label="Presentation"><button id="map-view" aria-pressed="true">Constellation</button><button id="deck-view" aria-pressed="false">Flight Deck</button></nav><span class="sample">SAMPLE DATA · LOCAL PROTOTYPE</span></header>
<div class="shell"><aside class="rail"><p class="label">YOUR WORK</p><h1>A little less<br>tangled.</h1><label class="label" for="search">FIND A WORKSTREAM</label><input id="search" placeholder="Search work…" type="search"><label class="label" for="filter">ATTENTION</label><select id="filter"><option value="all">All workstreams</option><option>Needs you</option><option>Waiting</option><option>Paused</option><option>Active</option></select><div id="queue"></div><footer>Read-only sample workspace.<br>Changes last until you close the app.</footer></aside>
<main><div class="canvas-heading"><div><p class="label">YOUR CONSTELLATION</p><h2 id="view-title">See the connections.</h2></div><button id="reset">Show all</button></div><div id="signal" role="status"></div><div id="map"><svg id="edges" aria-hidden="true"></svg><div id="nodes"></div></div><div id="deck" hidden></div><div class="legend">Select a workstream to expand sessions. Select its root to return.</div></main><aside id="inspector" aria-label="Workstream brief"></aside></div><script src="sessions.js"></script><script src="records.js"></script><script src="app.js"></script></body></html>
